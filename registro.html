<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta | Kratero Fit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(1200px 560px at 10% -15%, rgba(142,182,155,0.14), transparent 60%),
        radial-gradient(1000px 520px at 108% 0%, rgba(218,241,222,0.07), transparent 55%),
        radial-gradient(900px 700px at 50% 120%, rgba(22,56,50,0.35), transparent 60%),
        linear-gradient(180deg, #0B2B26 0%, #051F20 45%, #051F20 100%);
      background-attachment: fixed;
    }
    .font-display { font-family: 'Fraunces', serif; }
    [class*="bg-[#0B2B26]"] { box-shadow: 0 14px 34px -18px rgba(0,0,0,.55); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #051F20; }
    ::-webkit-scrollbar-thumb { background: #235347; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #DAF1DE; }
  </style>
</head>
<body class="bg-[#051F20] text-[#F9F6F0] flex items-center justify-center min-h-screen p-4 py-8">

  <div class="bg-[#0B2B26] border border-[#DAF1DE]/20 rounded-2xl p-8 max-w-lg w-full shadow-2xl space-y-6">
    <div class="text-center space-y-3">
      <img src="logo.png" alt="Kratero Fit" class="w-14 h-14 mx-auto object-contain drop-shadow-[0_0_14px_rgba(218,241,222,0.3)]">
      <div>
        <h1 class="font-display text-3xl text-[#DAF1DE]">Crear cuenta</h1>
        <p class="text-xs text-[#F9F6F0]/60 mt-1">Ingresa tus datos para personalizar tu entrenamiento</p>
      </div>
    </div>

    <form id="register-form" class="space-y-5">
      <div class="space-y-4">
        <p class="text-[11px] font-bold text-[#DAF1DE]/70 uppercase tracking-wide border-b border-[#DAF1DE]/10 pb-1.5">Datos de acceso</p>
        <div>
          <label class="block text-xs font-bold text-[#DAF1DE] mb-1">Nombre Completo</label>
          <input type="text" id="reg-nombre" required placeholder="Ej. Isaac González" class="w-full bg-[#051F20] border border-[#DAF1DE]/30 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-[#DAF1DE]/40 focus:border-[#DAF1DE] transition">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-[#DAF1DE] mb-1">Correo Electrónico</label>
            <input type="email" id="reg-email" required placeholder="tu@correo.com" class="w-full bg-[#051F20] border border-[#DAF1DE]/30 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-[#DAF1DE]/40 focus:border-[#DAF1DE] transition">
          </div>
          <div>
            <label class="block text-xs font-bold text-[#DAF1DE] mb-1">Contraseña</label>
            <input type="password" id="reg-password" minlength="6" required placeholder="••••••••" class="w-full bg-[#051F20] border border-[#DAF1DE]/30 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-[#DAF1DE]/40 focus:border-[#DAF1DE] transition">
          </div>
        </div>
      </div>

      <!-- Datos Físicos -->
      <div class="space-y-4">
        <p class="text-[11px] font-bold text-[#DAF1DE]/70 uppercase tracking-wide border-b border-[#DAF1DE]/10 pb-1.5">Ficha física</p>
      <div class="grid grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-bold text-[#DAF1DE] mb-1">Edad</label>
          <input type="number" id="reg-edad" required placeholder="25" min="10" max="100" class="w-full bg-[#051F20] border border-[#DAF1DE]/30 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-[#DAF1DE]/40 focus:border-[#DAF1DE] transition">
        </div>
        <div>
          <label class="block text-xs font-bold text-[#DAF1DE] mb-1">Peso (kg)</label>
          <input type="number" step="0.1" id="reg-peso" required placeholder="70.5" class="w-full bg-[#051F20] border border-[#DAF1DE]/30 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-[#DAF1DE]/40 focus:border-[#DAF1DE] transition">
        </div>
        <div>
          <label class="block text-xs font-bold text-[#DAF1DE] mb-1">Estatura (cm)</label>
          <input type="number" id="reg-estatura" required placeholder="175" class="w-full bg-[#051F20] border border-[#DAF1DE]/30 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-[#DAF1DE]/40 focus:border-[#DAF1DE] transition">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-[#DAF1DE] mb-1">Nivel de Actividad</label>
        <select id="reg-actividad" required class="w-full bg-[#051F20] border border-[#DAF1DE]/30 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-[#DAF1DE]/40 focus:border-[#DAF1DE] transition">
          <option value="" disabled selected>Selecciona una opción</option>
          <option value="Sedentario">Sedentario (Poco o ningún ejercicio)</option>
          <option value="Ligero">Ligero (1-3 días/semana)</option>
          <option value="Moderado">Moderado (3-5 días/semana)</option>
          <option value="Muy Activo">Muy Activo (6-7 días/semana)</option>
        </select>
      </div>
      </div>

      <div class="space-y-4">
        <p class="text-[11px] font-bold text-[#DAF1DE]/70 uppercase tracking-wide border-b border-[#DAF1DE]/10 pb-1.5">Entrenador y condiciones</p>
        <div>
          <label class="block text-xs font-bold text-[#DAF1DE] mb-1">Elige tu Entrenador</label>
          <select id="reg-coach" required class="w-full bg-[#051F20] border border-[#DAF1DE]/30 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-[#DAF1DE]/40 focus:border-[#DAF1DE] transition">
            <option value="" disabled selected>Cargando entrenadores...</option>
          </select>
        </div>

        <div class="flex items-center gap-2">
          <input type="checkbox" id="reg-terms" required class="accent-[#DAF1DE] rounded">
          <label for="reg-terms" class="text-xs text-[#F9F6F0]/80">Acepto los <a href="terminos-privacidad.html" target="_blank" class="text-[#DAF1DE] underline hover:text-[#8EB69B]">términos y aviso de privacidad</a></label>
        </div>

        <button type="submit" id="btn-register" class="w-full bg-[#DAF1DE] text-[#051F20] font-bold py-3 rounded-xl hover:bg-[#8EB69B] hover:shadow-[0_8px_24px_-8px_rgba(218,241,222,0.5)] transition">Registrarme Ahora</button>
      </div>
    </form>

    <div class="text-center text-xs text-[#F9F6F0]/60">
      ¿Ya tienes cuenta? <a href="login.html" class="text-[#DAF1DE] font-bold hover:underline">Inicia Sesión</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = supabase.createClient('https://etdfskwtaargtrzisvmj.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0ZGZza3d0YWFyZ3Ryemlzdm1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNjQ4NjEsImV4cCI6MjEwNDc0MDg2MX0.5UlqtJfVORgsZXNvO-Mx12YKeP_kb_BrxqI2nXgyjcs');

    // Carga la lista de coaches activos para el selector.
    async function cargarCoaches() {
      const sel = document.getElementById('reg-coach');
      const { data: coaches, error } = await supabaseClient.from('profiles').select('id, nombre').eq('rol', 'coach');

      if (error || !coaches || coaches.length === 0) {
        sel.innerHTML = '<option value="" selected>Sin entrenador asignado por ahora</option>';
        sel.required = false;
        return;
      }
      sel.innerHTML = '<option value="" disabled selected>Selecciona un entrenador</option>' +
        coaches.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
    }
    cargarCoaches();

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nombre = document.getElementById('reg-nombre').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const edad = parseInt(document.getElementById('reg-edad').value);
      const peso = parseFloat(document.getElementById('reg-peso').value);
      const estatura = parseFloat(document.getElementById('reg-estatura').value);
      const actividad = document.getElementById('reg-actividad').value;
      const coachId = document.getElementById('reg-coach').value || null;

      const btn = document.getElementById('btn-register');
      btn.innerText = 'Creando cuenta...';
      btn.disabled = true;

      // 1. Crear usuario en Auth.
      // El coach_id viaja en el metadata: el trigger handle_new_user (en Supabase)
      // lo lee de ahí y lo guarda directo en profiles al crear la fila, sin que el
      // navegador tenga que escribir en profiles (evita el error de RLS de antes).
      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: { data: { nombre: nombre, coach_id: coachId } }
      });

      if (error) {
        alert('Error al registrar usuario: ' + error.message);
        btn.innerText = 'Registrarme Ahora';
        btn.disabled = false;
        return;
      }

      // 2. Completar el perfil con los datos físicos.
      // La fila base en "profiles" (id, nombre, email, rol, plan) ya la crea
      // automáticamente un trigger en la base de datos justo cuando se registra
      // el usuario en auth.users, así que aquí solo actualizamos el resto de
      // los datos. Esto evita el error de RLS que ocurría al intentar insertar
      // desde el navegador sin sesión activa (cuando la confirmación por
      // correo está habilitada).
      if (data?.user) {
        // Si el proyecto tiene confirmación de correo activada, en este punto
        // todavía no hay sesión, así que auth.uid() es null y cualquier
        // escritura en "profiles" sería rechazada por RLS. Detectamos ese
        // caso y avisamos al usuario en vez de mostrar un error confuso.
        if (!data.session) {
          window.location.href = 'gracias.html?confirmar=1';
          return;
        }

        const { error: profileError } = await supabaseClient
          .from('profiles')
          .update({
            nombre: nombre,
            edad: edad,
            peso: peso,
            estatura: estatura,
            nivel_actividad: actividad
          })
          .eq('id', data.user.id);

        if (profileError) {
          alert("Tu cuenta se creó, pero hubo un problema guardando tus datos físicos: " + profileError.message + "\nPodrás completarlos después desde tu perfil.");
        }
        window.location.href = 'gracias.html';
      }
    });
  </script>
</body>
</html>
