<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | Kratero Fit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(1200px 560px at 10% -15%, rgba(37,99,235,0.16), transparent 60%),
      linear-gradient(180deg, #060A1A 0%, #0A1128 50%, #050814 100%);
    }
    .font-display { font-family: 'Fraunces', serif; }
  </style>
</head>
<body class="bg-[#0A1128] text-[#F9F6F0] min-h-screen flex items-center justify-center p-4">

  <div class="bg-[#131E3A] border border-[#E5C39E]/20 p-8 rounded-3xl w-full max-w-md space-y-6 shadow-2xl">
    <div class="text-center space-y-2">
      <img src="logo.png" alt="Kratero Fit" class="w-12 h-12 mx-auto">
      <h1 class="font-display text-2xl text-[#E5C39E]">Kratero FIT</h1>
      <p class="text-xs text-white/50">Ingresa tus credenciales para acceder a tu panel</p>
    </div>

    <form id="form-login" class="space-y-4">
      <div>
        <label class="block text-xs text-white/60 mb-1">Correo Electrónico</label>
        <input id="login-email" type="email" required class="w-full bg-[#0A1128] border border-[#E5C39E]/30 rounded-xl p-3 text-xs text-white focus:outline-none focus:ring-2 focus:ring-[#E5C39E]/40 focus:border-[#E5C39E] transition">
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="block text-xs text-white/60">Contraseña</label>
          <a href="recuperar-password.html" class="text-[10px] font-bold text-[#E5C39E] hover:underline">¿Olvidaste tu contraseña?</a>
        </div>
        <input id="login-password" type="password" required class="w-full bg-[#0A1128] border border-[#E5C39E]/30 rounded-xl p-3 text-xs text-white focus:outline-none focus:ring-2 focus:ring-[#E5C39E]/40 focus:border-[#E5C39E] transition">
      </div>

      <p id="login-error" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/20 rounded-lg p-2.5"></p>

      <button type="submit" id="btn-login" class="w-full bg-[#E5C39E] text-[#0A1128] font-bold text-xs py-3.5 rounded-xl hover:bg-[#d4b08b] transition">Ingresar</button>
    </form>

    <p class="text-center text-xs text-white/50">
      ¿No tienes cuenta? <a href="registro.html" class="text-[#E5C39E] font-bold hover:underline">Regístrate</a>
    </p>

    <p class="text-center text-[10px] text-white/30">
      <a href="terminos-privacidad.html" class="hover:text-[#E5C39E] underline">Términos y aviso de privacidad</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = supabase.createClient('https://etdfskwtaargtrzisvmj.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0ZGZza3d0YWFyZ3Ryemlzdm1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNjQ4NjEsImV4cCI6MjEwNDc0MDg2MX0.5UlqtJfVORgsZXNvO-Mx12YKeP_kb_BrxqI2nXgyjcs');

    const errBox = document.getElementById('login-error');

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.add('hidden');

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.innerText = 'Ingresando...';

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        errBox.innerText = error.message.includes('Invalid login credentials')
          ? 'Correo o contraseña incorrectos.'
          : 'Error de inicio de sesión: ' + error.message;
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = 'Ingresar';
        return;
      }

      const { data: profile } = await supabaseClient.from('profiles').select('rol').eq('id', data.user.id).single();

      if (profile && (profile.rol === 'admin' || profile.rol === 'coach')) {
        window.location.href = 'admin-dashboard.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
