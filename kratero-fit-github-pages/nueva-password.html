<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña | Kratero Fit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #05070D;
    }
    .font-display { font-family: 'Fraunces', serif; }
  
    /* --- Kratero Fit: modo claro / oscuro --- */
    html { transition: filter .25s ease; }
    html[data-theme="light"] {
      filter: invert(1) hue-rotate(180deg);
      background: #fff;
    }
    html[data-theme="light"] img,
    html[data-theme="light"] svg,
    html[data-theme="light"] video,
    html[data-theme="light"] iframe {
      filter: invert(1) hue-rotate(180deg);
    }
    #kf-theme-toggle {
      position: fixed; z-index: 60; top: 14px; right: 14px;
      width: 38px; height: 38px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.35);
      color: #F5F7FA; font-size: 16px; cursor: pointer;
      backdrop-filter: blur(6px);
    }
    #kf-theme-toggle:active { background: rgba(59,130,246,0.25); }
  </style>
</head>
<body class="bg-[#05070D] text-[#F5F7FA] min-h-screen flex items-center justify-center p-4">
  <button id="kf-theme-toggle" title="Cambiar modo claro/oscuro" aria-label="Cambiar modo claro/oscuro">🌙</button>


  <div class="bg-[#0D1526] border border-[#3B82F6]/20 p-8 rounded-3xl w-full max-w-md space-y-6 shadow-2xl">
    <div class="text-center space-y-2">
      <img src="logo.png" alt="Kratero Fit" class="w-12 h-12 mx-auto">
      <h1 class="font-display text-2xl text-[#3B82F6]">Crea tu nueva contraseña</h1>
      <p class="text-xs text-white/50">Elige una contraseña de al menos 6 caracteres.</p>
    </div>

    <!-- Mensaje si el enlace ya expiró o es inválido -->
    <div id="enlace-invalido" class="hidden bg-red-500/10 border border-red-500/20 rounded-xl p-4 text-center space-y-3">
      <p class="text-xs text-red-400">Este enlace de recuperación no es válido o ya expiró.</p>
      <a href="recuperar-password.html" class="inline-block bg-[#3B82F6] text-[#05070D] font-bold text-xs px-4 py-2.5 rounded-xl hover:bg-[#2563eb] transition">Solicitar uno nuevo</a>
    </div>

    <form id="form-nueva" class="space-y-4 hidden">
      <div>
        <label class="block text-xs text-white/60 mb-1">Nueva contraseña</label>
        <input id="np-password" type="password" minlength="6" required placeholder="••••••••" class="w-full bg-[#05070D] border border-[#3B82F6]/30 rounded-xl p-3 text-xs text-white focus:outline-none focus:ring-2 focus:ring-[#3B82F6]/40 focus:border-[#3B82F6] transition">
      </div>
      <div>
        <label class="block text-xs text-white/60 mb-1">Confirmar contraseña</label>
        <input id="np-password2" type="password" minlength="6" required placeholder="••••••••" class="w-full bg-[#05070D] border border-[#3B82F6]/30 rounded-xl p-3 text-xs text-white focus:outline-none focus:ring-2 focus:ring-[#3B82F6]/40 focus:border-[#3B82F6] transition">
      </div>

      <p id="np-error" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/20 rounded-lg p-2.5"></p>

      <button type="submit" id="btn-nueva" class="w-full bg-[#3B82F6] text-[#05070D] font-bold text-xs py-3.5 rounded-xl hover:bg-[#2563eb] transition">Guardar contraseña</button>
    </form>

    <p id="np-cargando" class="text-center text-xs text-white/40">Validando el enlace...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = supabase.createClient('https://etdfskwtaargtrzisvmj.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0ZGZza3d0YWFyZ3Ryemlzdm1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNjQ4NjEsImV4cCI6MjEwNDc0MDg2MX0.5UlqtJfVORgsZXNvO-Mx12YKeP_kb_BrxqI2nXgyjcs', {
      auth: {
        persistSession: true,     // guarda la sesión en este dispositivo
        autoRefreshToken: true,   // la renueva sola en segundo plano
        detectSessionInUrl: true  // necesario para los links de recuperación de contraseña
      }
    });

    const form = document.getElementById('form-nueva');
    const cargando = document.getElementById('np-cargando');
    const invalido = document.getElementById('enlace-invalido');
    const errBox = document.getElementById('np-error');

    // Al abrir el enlace del correo, Supabase crea una sesión temporal de
    // recuperación. Si existe, dejamos cambiar la contraseña.
    async function validarEnlace() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      cargando.classList.add('hidden');
      if (session) {
        form.classList.remove('hidden');
      } else {
        invalido.classList.remove('hidden');
      }
    }

    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
        cargando.classList.add('hidden');
        invalido.classList.add('hidden');
        form.classList.remove('hidden');
      }
    });

    setTimeout(validarEnlace, 700);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.add('hidden');

      const p1 = document.getElementById('np-password').value;
      const p2 = document.getElementById('np-password2').value;

      if (p1.length < 6) {
        errBox.innerText = 'La contraseña debe tener al menos 6 caracteres.';
        errBox.classList.remove('hidden');
        return;
      }
      if (p1 !== p2) {
        errBox.innerText = 'Las contraseñas no coinciden.';
        errBox.classList.remove('hidden');
        return;
      }

      const btn = document.getElementById('btn-nueva');
      btn.disabled = true;
      btn.innerText = 'Guardando...';

      const { error } = await supabaseClient.auth.updateUser({ password: p1 });

      btn.disabled = false;
      btn.innerText = 'Guardar contraseña';

      if (error) {
        errBox.innerText = 'No se pudo actualizar: ' + error.message;
        errBox.classList.remove('hidden');
        return;
      }

      alert('¡Contraseña actualizada! Ya puedes iniciar sesión.');
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    });
  </script>

  <script>
    // --- Kratero Fit: modo claro / oscuro (persistente en este dispositivo) ---
    (function () {
      const KEY = 'kf-theme';
      const root = document.documentElement;
      const saved = localStorage.getItem(KEY) || 'dark';
      if (saved === 'light') root.setAttribute('data-theme', 'light');

      function actualizarIcono() {
        const btn = document.getElementById('kf-theme-toggle');
        if (!btn) return;
        btn.textContent = root.getAttribute('data-theme') === 'light' ? '☀️' : '🌙';
      }

      document.addEventListener('DOMContentLoaded', () => {
        actualizarIcono();
        const btn = document.getElementById('kf-theme-toggle');
        if (btn) {
          btn.addEventListener('click', () => {
            const esClaro = root.getAttribute('data-theme') === 'light';
            if (esClaro) { root.removeAttribute('data-theme'); localStorage.setItem(KEY, 'dark'); }
            else { root.setAttribute('data-theme', 'light'); localStorage.setItem(KEY, 'light'); }
            actualizarIcono();
          });
        }
      });
    })();
  </script>
</body>
</html>
