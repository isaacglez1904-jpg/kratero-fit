<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña | Kratero Fit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(1200px 560px at 10% -15%, rgba(142,182,155,0.14), transparent 60%),
      linear-gradient(180deg, #0B2B26 0%, #051F20 50%, #051F20 100%);
    }
    .font-display { font-family: 'Fraunces', serif; }
  </style>
</head>
<body class="bg-[#051F20] text-[#F9F6F0] min-h-screen flex items-center justify-center p-4">

  <div class="bg-[#0B2B26] border border-[#DAF1DE]/20 p-8 rounded-3xl w-full max-w-md space-y-6 shadow-2xl">
    <div class="text-center space-y-2">
      <img src="logo.png" alt="Kratero Fit" class="w-12 h-12 mx-auto">
      <h1 class="font-display text-2xl text-[#DAF1DE]">Crea tu nueva contraseña</h1>
      <p class="text-xs text-white/50">Elige una contraseña de al menos 6 caracteres.</p>
    </div>

    <!-- Mensaje si el enlace ya expiró o es inválido -->
    <div id="enlace-invalido" class="hidden bg-red-500/10 border border-red-500/20 rounded-xl p-4 text-center space-y-3">
      <p class="text-xs text-red-400">Este enlace de recuperación no es válido o ya expiró.</p>
      <a href="recuperar-password.html" class="inline-block bg-[#DAF1DE] text-[#051F20] font-bold text-xs px-4 py-2.5 rounded-xl hover:bg-[#8EB69B] transition">Solicitar uno nuevo</a>
    </div>

    <form id="form-nueva" class="space-y-4 hidden">
      <div>
        <label class="block text-xs text-white/60 mb-1">Nueva contraseña</label>
        <input id="np-password" type="password" minlength="6" required placeholder="••••••••" class="w-full bg-[#051F20] border border-[#DAF1DE]/30 rounded-xl p-3 text-xs text-white focus:outline-none focus:ring-2 focus:ring-[#DAF1DE]/40 focus:border-[#DAF1DE] transition">
      </div>
      <div>
        <label class="block text-xs text-white/60 mb-1">Confirmar contraseña</label>
        <input id="np-password2" type="password" minlength="6" required placeholder="••••••••" class="w-full bg-[#051F20] border border-[#DAF1DE]/30 rounded-xl p-3 text-xs text-white focus:outline-none focus:ring-2 focus:ring-[#DAF1DE]/40 focus:border-[#DAF1DE] transition">
      </div>

      <p id="np-error" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/20 rounded-lg p-2.5"></p>

      <button type="submit" id="btn-nueva" class="w-full bg-[#DAF1DE] text-[#051F20] font-bold text-xs py-3.5 rounded-xl hover:bg-[#8EB69B] transition">Guardar contraseña</button>
    </form>

    <p id="np-cargando" class="text-center text-xs text-white/40">Validando el enlace...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = supabase.createClient('https://etdfskwtaargtrzisvmj.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0ZGZza3d0YWFyZ3Ryemlzdm1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNjQ4NjEsImV4cCI6MjEwNDc0MDg2MX0.5UlqtJfVORgsZXNvO-Mx12YKeP_kb_BrxqI2nXgyjcs');

    const form = document.getElementById('form-nueva');
    const cargando = document.getElementById('np-cargando');
    const invalido = document.getElementById('enlace-invalido');
    const errBox = document.getElementById('np-error');

    // Al abrir el enlace del correo, Supabase crea una sesión temporal de
    // recuperación. Si existe, dejamos cambiar la contraseña.
    async function validarEnlace() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      cargando.classList.add('hidden');
      if (session) {
        form.classList.remove('hidden');
      } else {
        invalido.classList.remove('hidden');
      }
    }

    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
        cargando.classList.add('hidden');
        invalido.classList.add('hidden');
        form.classList.remove('hidden');
      }
    });

    setTimeout(validarEnlace, 700);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.add('hidden');

      const p1 = document.getElementById('np-password').value;
      const p2 = document.getElementById('np-password2').value;

      if (p1.length < 6) {
        errBox.innerText = 'La contraseña debe tener al menos 6 caracteres.';
        errBox.classList.remove('hidden');
        return;
      }
      if (p1 !== p2) {
        errBox.innerText = 'Las contraseñas no coinciden.';
        errBox.classList.remove('hidden');
        return;
      }

      const btn = document.getElementById('btn-nueva');
      btn.disabled = true;
      btn.innerText = 'Guardando...';

      const { error } = await supabaseClient.auth.updateUser({ password: p1 });

      btn.disabled = false;
      btn.innerText = 'Guardar contraseña';

      if (error) {
        errBox.innerText = 'No se pudo actualizar: ' + error.message;
        errBox.classList.remove('hidden');
        return;
      }

      alert('¡Contraseña actualizada! Ya puedes iniciar sesión.');
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
