<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil | Kratero Fit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(1200px 560px at 10% -15%, rgba(142,182,155,0.14), transparent 60%),
        radial-gradient(1000px 520px at 108% 0%, rgba(218,241,222,0.07), transparent 55%),
        radial-gradient(900px 700px at 50% 120%, rgba(22,56,50,0.35), transparent 60%),
        linear-gradient(180deg, #0B2B26 0%, #051F20 45%, #051F20 100%);
      background-attachment: fixed;
    }
    .font-display { font-family: 'Fraunces', serif; }
    [class*="bg-[#0B2B26]"] { box-shadow: 0 14px 34px -18px rgba(0,0,0,.55); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #051F20; }
    ::-webkit-scrollbar-thumb { background: #235347; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #DAF1DE; }
  </style>
</head>
<body class="bg-[#051F20] text-[#F9F6F0] min-h-screen">

  <nav class="bg-[#0B2B26] border-b border-[#DAF1DE]/20 px-6 py-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <a href="dashboard.html" class="flex items-center gap-2 text-xs font-bold text-white/70 hover:text-[#DAF1DE] transition">
        <span aria-hidden="true">←</span> Volver al panel
      </a>
      <button id="btn-logout" class="bg-red-500/10 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-red-500 hover:text-white transition">Salir</button>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto p-4 md:p-8 space-y-8">

    <!-- CABECERA -->
    <section class="bg-[#0B2B26] border border-[#DAF1DE]/20 p-6 rounded-2xl shadow-xl flex items-center gap-4">
      <div id="perfil-avatar" class="w-16 h-16 rounded-full bg-[#DAF1DE]/15 border border-[#DAF1DE]/30 flex items-center justify-center text-2xl font-black text-[#DAF1DE] font-display shrink-0">?</div>
      <div class="min-w-0">
        <h1 id="perfil-nombre" class="font-display text-2xl text-[#DAF1DE] truncate">Cargando...</h1>
        <p id="perfil-email" class="text-xs text-white/50 truncate">—</p>
        <span id="perfil-plan" class="inline-block mt-1 text-[10px] font-bold bg-[#DAF1DE]/10 text-[#DAF1DE] border border-[#DAF1DE]/20 px-2.5 py-0.5 rounded-full">Plan</span>
      </div>
    </section>

    <!-- COACH ASIGNADO -->
    <section id="perfil-coach-card" class="hidden bg-[#0B2B26] border border-[#DAF1DE]/20 p-5 rounded-2xl shadow-xl flex items-center gap-3">
      <span class="text-2xl">🧑‍🏫</span>
      <div>
        <p class="text-[10px] font-bold text-white/40 uppercase tracking-wide">Tu entrenador asignado</p>
        <p id="perfil-coach-nombre" class="text-sm font-bold text-white">—</p>
      </div>
    </section>

    <!-- DATOS FÍSICOS (editable) -->
    <section class="bg-[#0B2B26] border border-[#DAF1DE]/20 p-6 rounded-2xl shadow-xl space-y-4">
      <h2 class="text-lg font-bold text-[#DAF1DE]">Ficha física</h2>
      <form id="form-perfil" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-white mb-1">Nombre completo</label>
          <input type="text" id="pf-nombre" required class="w-full bg-[#051F20] border border-[#DAF1DE]/30 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-[#DAF1DE]/40 focus:border-[#DAF1DE] transition">
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-bold text-white mb-1">Edad</label>
            <input type="number" id="pf-edad" min="10" max="100" class="w-full bg-[#051F20] border border-[#DAF1DE]/30 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-[#DAF1DE]">
          </div>
          <div>
            <label class="block text-xs font-bold text-white mb-1">Peso (kg)</label>
            <input type="number" step="0.1" id="pf-peso" class="w-full bg-[#051F20] border border-[#DAF1DE]/30 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-[#DAF1DE]">
          </div>
          <div>
            <label class="block text-xs font-bold text-white mb-1">Estatura (cm)</label>
            <input type="number" id="pf-estatura" class="w-full bg-[#051F20] border border-[#DAF1DE]/30 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-[#DAF1DE]">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-white mb-1">Nivel de actividad</label>
          <select id="pf-actividad" class="w-full bg-[#051F20] border border-[#DAF1DE]/30 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-[#DAF1DE]">
            <option value="Sedentario">Sedentario (Poco o ningún ejercicio)</option>
            <option value="Ligero">Ligero (1-3 días/semana)</option>
            <option value="Moderado">Moderado (3-5 días/semana)</option>
            <option value="Muy Activo">Muy Activo (6-7 días/semana)</option>
          </select>
        </div>
        <button type="submit" id="btn-guardar-perfil" class="w-full bg-[#DAF1DE] text-[#051F20] font-bold py-3 rounded-xl text-sm hover:bg-[#8EB69B] hover:shadow-[0_8px_24px_-8px_rgba(218,241,222,0.5)] transition">Guardar Cambios</button>
        <p id="perfil-guardado-msg" class="hidden text-xs text-green-400 text-center font-bold">✓ Perfil actualizado correctamente</p>
      </form>
    </section>

    <!-- SEGURIDAD -->
    <section class="bg-[#0B2B26] border border-[#DAF1DE]/20 p-6 rounded-2xl shadow-xl space-y-4">
      <h2 class="text-lg font-bold text-[#DAF1DE]">Seguridad</h2>
      <form id="form-password" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-white mb-1">Nueva contraseña</label>
          <input type="password" id="pf-password" minlength="6" placeholder="Mínimo 6 caracteres" class="w-full bg-[#051F20] border border-[#DAF1DE]/30 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-[#DAF1DE]">
        </div>
        <button type="submit" class="w-full bg-white/10 text-white font-bold py-2.5 rounded-xl text-xs hover:bg-white/20 transition">Actualizar Contraseña</button>
      </form>
    </section>

    <p class="text-center text-[10px] text-white/30 pb-4">
      ¿Dudas sobre tus datos? Revisa nuestros <a href="terminos-privacidad.html" class="underline hover:text-[#DAF1DE]">términos y aviso de privacidad</a>.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = supabase.createClient('https://etdfskwtaargtrzisvmj.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0ZGZza3d0YWFyZ3Ryemlzdm1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNjQ4NjEsImV4cCI6MjEwNDc0MDg2MX0.5UlqtJfVORgsZXNvO-Mx12YKeP_kb_BrxqI2nXgyjcs');

    let currentUser = null;

    async function initPerfil() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) { window.location.href = 'login.html'; return; }
      currentUser = user;

      const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).maybeSingle();
      if (!profile) return;

      document.getElementById('perfil-nombre').innerText = profile.nombre || 'Atleta';
      document.getElementById('perfil-avatar').innerText = (profile.nombre || 'A').trim().charAt(0).toUpperCase();
      document.getElementById('perfil-email').innerText = profile.email || user.email;
      document.getElementById('perfil-plan').innerText = profile.plan || 'Plan Básico';

      document.getElementById('pf-nombre').value = profile.nombre || '';
      document.getElementById('pf-edad').value = profile.edad || '';
      document.getElementById('pf-peso').value = profile.peso || '';
      document.getElementById('pf-estatura').value = profile.estatura || '';
      document.getElementById('pf-actividad').value = profile.nivel_actividad || 'Moderado';

      if (profile.coach_id) {
        const { data: coach } = await supabaseClient.from('profiles').select('nombre').eq('id', profile.coach_id).maybeSingle();
        if (coach) {
          document.getElementById('perfil-coach-nombre').innerText = coach.nombre;
          document.getElementById('perfil-coach-card').classList.remove('hidden');
        }
      }
    }

    document.getElementById('form-perfil').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-guardar-perfil');
      btn.disabled = true;
      btn.innerText = 'Guardando...';

      const { error } = await supabaseClient.from('profiles').update({
        nombre: document.getElementById('pf-nombre').value.trim(),
        edad: parseInt(document.getElementById('pf-edad').value) || null,
        peso: parseFloat(document.getElementById('pf-peso').value) || null,
        estatura: parseFloat(document.getElementById('pf-estatura').value) || null,
        nivel_actividad: document.getElementById('pf-actividad').value
      }).eq('id', currentUser.id);

      btn.disabled = false;
      btn.innerText = 'Guardar Cambios';

      if (error) {
        alert('Error al guardar: ' + error.message);
        return;
      }
      const msg = document.getElementById('perfil-guardado-msg');
      msg.classList.remove('hidden');
      setTimeout(() => msg.classList.add('hidden'), 2500);
      initPerfil();
    });

    document.getElementById('form-password').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nueva = document.getElementById('pf-password').value;
      if (!nueva || nueva.length < 6) return alert('La contraseña debe tener al menos 6 caracteres.');

      const { error } = await supabaseClient.auth.updateUser({ password: nueva });
      if (error) {
        alert('Error al actualizar la contraseña: ' + error.message);
        return;
      }
      alert('Contraseña actualizada correctamente.');
      document.getElementById('pf-password').value = '';
    });

    document.getElementById('btn-logout').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    });

    initPerfil();
  </script>
</body>
</html>
