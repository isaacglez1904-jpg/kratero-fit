<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña | Kratero Fit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(1100px 520px at 12% -12%, rgba(59,130,246,0.07), transparent 60%), #05070D;
    }
    .font-display { font-family: 'Fraunces', serif; }
  
    /* --- Kratero Fit: modo claro / oscuro --- */
    html { transition: filter .25s ease; }
    html[data-theme="light"] {
      filter: invert(1) hue-rotate(180deg);
      background: #fff;
    }
    html[data-theme="light"] img,
    html[data-theme="light"] svg,
    html[data-theme="light"] video,
    html[data-theme="light"] iframe {
      filter: invert(1) hue-rotate(180deg);
    }
    #kf-theme-toggle {
      position: fixed; z-index: 60; top: 14px; right: 14px;
      width: 38px; height: 38px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.35);
      color: #F5F7FA; font-size: 16px; cursor: pointer;
      backdrop-filter: blur(6px);
    }
    #kf-theme-toggle:active { background: rgba(59,130,246,0.25); }
  </style>
</head>
<body class="bg-[#05070D] text-[#F5F7FA] min-h-screen flex items-center justify-center p-4">
  <button id="kf-theme-toggle" title="Cambiar modo claro/oscuro" aria-label="Cambiar modo claro/oscuro">🌙</button>


  <div class="bg-[#0D1526] border border-[#3B82F6]/20 p-8 rounded-3xl w-full max-w-md space-y-6 shadow-2xl">
    <div class="text-center space-y-2">
      <img src="logo.png" alt="Kratero Fit" class="w-12 h-12 mx-auto">
      <h1 class="font-display text-2xl text-[#3B82F6]">¿Olvidaste tu contraseña?</h1>
      <p class="text-xs text-white/50">Escribe tu correo y te enviaremos un enlace para crear una nueva.</p>
    </div>

    <form id="form-recuperar" class="space-y-4">
      <div>
        <label class="block text-xs text-white/60 mb-1">Correo Electrónico</label>
        <input id="rec-email" type="email" required placeholder="tu@correo.com" class="w-full bg-[#05070D] border border-[#3B82F6]/30 rounded-xl p-3 text-xs text-white focus:outline-none focus:ring-2 focus:ring-[#3B82F6]/40 focus:border-[#3B82F6] transition">
      </div>

      <p id="rec-error" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/20 rounded-lg p-2.5"></p>
      <p id="rec-ok" class="hidden text-xs text-green-400 bg-green-500/10 border border-green-500/20 rounded-lg p-3 leading-relaxed"></p>

      <button type="submit" id="btn-recuperar" class="w-full bg-[#3B82F6] text-[#05070D] font-bold text-xs py-3.5 rounded-xl hover:bg-[#2563eb] transition">Enviar enlace de recuperación</button>
    </form>

    <p class="text-center text-xs text-white/50">
      <a href="login.html" class="text-[#3B82F6] font-bold hover:underline">← Volver a iniciar sesión</a>
    </p>

    <p class="text-center text-[10px] text-white/30">
      <a href="terminos-privacidad.html" class="hover:text-[#3B82F6] underline">Términos y aviso de privacidad</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = supabase.createClient('https://etdfskwtaargtrzisvmj.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0ZGZza3d0YWFyZ3Ryemlzdm1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNjQ4NjEsImV4cCI6MjEwNDc0MDg2MX0.5UlqtJfVORgsZXNvO-Mx12YKeP_kb_BrxqI2nXgyjcs', {
      auth: {
        persistSession: true,     // guarda la sesión en este dispositivo
        autoRefreshToken: true,   // la renueva sola en segundo plano
        detectSessionInUrl: true  // necesario para los links de recuperación de contraseña
      }
    });

    const errBox = document.getElementById('rec-error');
    const okBox = document.getElementById('rec-ok');

    document.getElementById('form-recuperar').addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.add('hidden');
      okBox.classList.add('hidden');

      const email = document.getElementById('rec-email').value.trim();
      const btn = document.getElementById('btn-recuperar');
      btn.disabled = true;
      btn.innerText = 'Enviando...';

      // El enlace del correo regresa a nueva-password.html, donde el usuario
      // define su nueva contraseña con la sesión temporal de recuperación.
      const redirectTo = window.location.origin + window.location.pathname.replace('recuperar-password.html', 'nueva-password.html');

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });

      btn.disabled = false;
      btn.innerText = 'Enviar enlace de recuperación';

      if (error) {
        errBox.innerText = 'No se pudo enviar el correo: ' + error.message;
        errBox.classList.remove('hidden');
        return;
      }

      okBox.innerText = '✓ Si ese correo está registrado, te llegará un enlace para restablecer tu contraseña. Revisa también tu carpeta de spam.';
      okBox.classList.remove('hidden');
      document.getElementById('rec-email').value = '';
    });
  </script>

  <script>
    // --- Kratero Fit: modo claro / oscuro (persistente en este dispositivo) ---
    (function () {
      const KEY = 'kf-theme';
      const root = document.documentElement;
      const saved = localStorage.getItem(KEY) || 'dark';
      if (saved === 'light') root.setAttribute('data-theme', 'light');

      function actualizarIcono() {
        const btn = document.getElementById('kf-theme-toggle');
        if (!btn) return;
        btn.textContent = root.getAttribute('data-theme') === 'light' ? '☀️' : '🌙';
      }

      document.addEventListener('DOMContentLoaded', () => {
        actualizarIcono();
        const btn = document.getElementById('kf-theme-toggle');
        if (btn) {
          btn.addEventListener('click', () => {
            const esClaro = root.getAttribute('data-theme') === 'light';
            if (esClaro) { root.removeAttribute('data-theme'); localStorage.setItem(KEY, 'dark'); }
            else { root.setAttribute('data-theme', 'light'); localStorage.setItem(KEY, 'light'); }
            actualizarIcono();
          });
        }
      });
    })();
  </script>
</body>
</html>
